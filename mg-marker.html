<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>机枪位置标注工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #panel {
    position: fixed; top: 10px; left: 10px; background: rgba(20,20,40,0.92);
    border: 1px solid #4a4a6a; border-radius: 8px; padding: 16px; min-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  h2 { font-size: 16px; margin-bottom: 10px; color: #8af; }
  .row { margin: 6px 0; font-size: 13px; line-height: 1.6; }
  .coord { font-family: monospace; font-size: 14px; color: #fc6; }
  button {
    background: #4a6; color: #fff; border: none; border-radius: 4px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; margin: 4px 4px 4px 0;
  }
  button:hover { background: #5b7; }
  button.blue { background: #46a; }
  button.blue:hover { background: #57b; }
  select { background: #2a2a4e; color: #eee; border: 1px solid #4a4a6a; padding: 4px; border-radius: 4px; }
  #info { color: #888; font-size: 12px; margin-top: 8px; }
  .marker-info { background: #2a2a4e; border-radius: 4px; padding: 8px; margin: 4px 0; }
</style>
</head>
<body>
<div id="panel">
  <h2>机枪位置标注工具</h2>
  <div class="row">
    模型: <select id="modelSel">
      <option value="t-14_armata">T-14 阿玛塔</option>
      <option value="abrams_x">M1A2 X</option>
      <option value="ztz-99a">ZTZ-99A</option>
      <option value="kf51">KF51 黑豹</option>
    </select>
    <button class="blue" onclick="loadModel()">加载</button>
  </div>
  <div class="row" id="turretInfo">炮塔中心: -</div>
  <div class="row" id="markerInfo">机枪位置: 未标注</div>
  <div class="row">
    <button onclick="exportParam()">导出参数</button>
    <button class="blue" onclick="clearMarker()">清除标记</button>
  </div>
  <div id="info">
    操作: 左键点击模型表面放置标记<br>
    右键拖拽旋转 · 滚轮缩放<br>
    标记位置即机枪枪口坐标
  </div>
  <div id="exportResult" style="margin-top:8px;"></div>
</div>
<canvas id="canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);
camera.position.set(20, 15, 20);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

// 灯光
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// 网格
const grid = new THREE.GridHelper(50, 50, 0x444466, 0x222244);
scene.add(grid);

let model = null;
let marker = null;
let turretPivot = null;
let turretSphere = null;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

window.loadModel = async function() {
  const name = document.getElementById('modelSel').value;
  // 加载 config 获取 turretPivot
  const cfgResp = await fetch('js/config.js');
  const cfgText = await cfgResp.text();
  const cfgMatch = cfgText.match(new RegExp(`'${name}'\\s*:\\s*\\{([\\s\\S]*?)\\n  \\},`));
  let turretP = [0, 0, 0], scale = 1;
  if (cfgMatch) {
    const tpMatch = cfgMatch[1].match(/turretPivot:\s*\[([^\]]+)\]/);
    if (tpMatch) turretP = tpMatch[1].split(',').map(Number);
    const scMatch = cfgMatch[1].match(/scale:\s*([\d.]+)/);
    if (scMatch) scale = parseFloat(scMatch[1]);
  }
  turretPivot = turretP;

  // 清除旧模型
  if (model) scene.remove(model);
  if (marker) { scene.remove(marker); marker = null; }

  const loader = new GLTFLoader();
  loader.load(`model/${name}.glb`, (gltf) => {
    model = new THREE.Group();
    model.scale.setScalar(scale);
    model.add(gltf.scene);
    scene.add(model);

    // 炮塔中心标记球
    if (turretSphere) scene.remove(turretSphere);
    const tg = new THREE.SphereGeometry(0.3, 16, 16);
    const tm = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
    turretSphere = new THREE.Mesh(tg, tm);
    turretSphere.position.fromArray(turretP);
    scene.add(turretSphere);

    document.getElementById('turretInfo').innerHTML =
      `炮塔中心: <span class="coord">[${turretP.map(v=>v.toFixed(2)).join(', ')}]</span>`;

    // 自动调整相机
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length();
    camera.position.copy(center).add(new THREE.Vector3(size * 0.6, size * 0.4, size * 0.6));
    controls.target.copy(center);
    controls.update();
  });
};

// 点击放置标记
canvas.addEventListener('click', (e) => {
  if (e.button !== 0) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  if (!model) return;
  const hits = raycaster.intersectObject(model, true);
  if (hits.length > 0) {
    const point = hits[0].point;
    // 转换为模型局部坐标（未缩放）
    const local = model.worldToLocal(point.clone());
    if (marker) scene.remove(marker);
    const g = new THREE.SphereGeometry(0.2, 16, 16);
    const m = new THREE.MeshBasicMaterial({ color: 0xff4400 });
    marker = new THREE.Mesh(g, m);
    marker.position.copy(point);
    scene.add(marker);
    // 添加竖线辅助
    const lineGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(point.x, 0, point.z),
      point.clone(),
    ]);
    const lineMat = new THREE.LineBasicMaterial({ color: 0xff4400 });
    const line = new THREE.Line(lineGeom, lineMat);
    marker.add(line);

    document.getElementById('markerInfo').innerHTML =
      `机枪位置: <span class="coord">[${local.x.toFixed(2)}, ${local.y.toFixed(2)}, ${local.z.toFixed(2)}]</span>`;
    marker.userData.local = local;
  }
});

window.clearMarker = function() {
  if (marker) { scene.remove(marker); marker = null; }
  document.getElementById('markerInfo').innerHTML = '机枪位置: 未标注';
  document.getElementById('exportResult').innerHTML = '';
};

window.exportParam = function() {
  if (!marker || !marker.userData.local) {
    alert('请先点击模型表面标注机枪位置');
    return;
  }
  const v = marker.userData.local;
  const text = `mgMuzzleLocal: [${v.x.toFixed(2)}, ${v.y.toFixed(2)}, ${v.z.toFixed(2)}]`;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('exportResult').innerHTML =
      `<div class="marker-info"><b>已复制到剪贴板:</b><br><span class="coord">${text}</span></div>`;
  }).catch(() => {
    document.getElementById('exportResult').innerHTML =
      `<div class="marker-info"><span class="coord">${text}</span></div>`;
  });
};

// 自动加载 T-14
loadModel();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
