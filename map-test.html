  rig.attach(player);
  buildAmmoPanel();
}

// ═══════════════════════ 玩家操控（逐行复刻 main.js _playerControl） ═══════════════════════
function playerControl(dt) {
  const p = player;
  if (!p) return;

  // ── 油门（压下行程平滑 + 惯性滑行） ──
  let throttle = 0, steer = 0;
  if (input.key('KeyW') || input.key('ArrowUp')) throttle += 1;
  if (input.key('KeyS') || input.key('ArrowDown')) throttle -= 1;
  if (input.key('KeyA') || input.key('ArrowLeft')) steer += 1;
  if (input.key('KeyD') || input.key('ArrowRight')) steer -= 1;
  throttleSmooth = damp(throttleSmooth, throttle, 5, dt);
  if (Math.abs(throttleSmooth) < 0.02 && throttle === 0) throttleSmooth = 0;
  steerSmooth = damp(steerSmooth, steer, 5, dt);

  // ── 观瞄（鼠标）；镜内灵敏度随变倍降低 ──
  const sens = rig.aiming ? 0.00095 / rig.zoomMag : 0.0021;
  const { dx, dy, wheel } = input.consumeMouse();
  rig.addAim(dx * sens, dy * sens);
  if (wheel !== 0) {
    if (rig.aiming) rig.zoomAim(wheel);
    else rig.zoom(wheel);
  }
  rig.setAimMode(input.aiming);

  p.drive(dt, clamp(throttleSmooth, -1, 1), clamp(steerSmooth, -1, 1), input.key('Space'));

  // 炮塔伺服追踪准星目标点（含弹道补偿）
  p.aimAt(rig.aimTarget);
  p.updateTurret(dt);

  // ── 机枪（F 手动；地图测试无敌人，M 自动无目标） ──
  if (p.cfg.mg && p.mgGroup) {
    const mHeld = input.key('KeyM');
    if (mHeld && !playerControl._mgLatch) message('机枪自动射击：本图无敌方目标');
    playerControl._mgLatch = mHeld;
    p.mgTimer -= dt;
    let mgFire = false;
    if (input.key('KeyF')) mgFire = true;
    if (mgFire && !prevMgFire) audio.startMGLoop();
    if (!mgFire && prevMgFire) audio.stopMGLoop();
    prevMgFire = mgFire;
    if (mgFire && p.mgTimer <= 0 && p.mgAmmo > 0) {
      p.mgTimer = 1 / p.cfg.mg.rate;
      p.mgAmmo--;
      p.getMgMuzzle(_v2, _v3, null);
      const dd = p.cfg.mg.dispersion;
      _v3.x += (Math.random() * 2 - 1) * dd; _v3.y += (Math.random() * 2 - 1) * dd; _v3.z += (Math.random() * 2 - 1) * dd;
      _v3.normalize();
      effects.mgTracer(_v2, _v3, p.cfg.mg.range);
      effects.mgMuzzleFlash(_v2, _v3);
      audio.playMG();
      _v1.copy(_v2).addScaledVector(_v3, -0.6);
      _v1.y += 0.2;
      effects.ejectCasing(_v1, _v3, p.cfg.mg.casingType || 'mg');
    }
  }
  p.updateFireControl(dt);
  if (p.smokeCooldown > 0) p.smokeCooldown -= dt;

  // ── 开火 ──
  if (input.consumeFire()) {
    if (p.readyToFire()) {
      const shot = p.fire();
      shells.fire(shot);
      _v2.crossVectors(shot.dir, UP);
      if (_v2.lengthSq() < 1e-6) _v2.set(1, 0, 0);
      effects.muzzleBlast(shot.pos, shot.dir, _v2.normalize());
      rig.addShake(0.5);
      rig.addRecoil(1);
      if (rig.aiming) { rig.addAimKick(0.022); scopeFlash(); }
      audio.playFire(1, rig.aiming);
      // 炮弹抛壳：炮塔顶部靠后，延迟0.8-1.2秒（与 main.js 一致）
      {
        const ep = new THREE.Vector3().copy(p.root.position);
        ep.y += p.cfg.dims.turretTop + 0.3;
        ep.addScaledVector(shot.dir, -1.0);
        const ed = shot.dir.clone();
        const es = _v2.clone();
        setTimeout(() => effects.ejectCasing(ep, ed, 'cannon', es), 800 + Math.random() * 400);
      }
    } else {
      message('装填中…');
    }
  }
  // 装填完成提示音
  const reloading = p.reload > 0;
  if (prevReloading && !reloading) audio.playReloaded();
  prevReloading = reloading;

  // 发动机音随转速
  const rpm = Math.min(Math.abs(p.speed) / p.cfg.maxSpeedForward + Math.abs(throttle) * 0.25, 1);
  audio.setEngine(rpm, Math.abs(throttle));
}

// ═══════════════════════ 测距（复刻 main.js _updateRanging，敌坦求交换成布景求交） ═══════════════════════
function updateRanging() {
  aimDist = null;
  if (!player) return;
  const origin = camera.position;
  const dir = rig.aimDirection(rayDir);
  let best = 1600;
  // 建筑求交（地图测试版：射线打布景网格）
  raycaster.set(origin, dir);
  raycaster.far = 1600;
  const hits = raycaster.intersectObject(townGroup, true);
  if (hits.length && hits[0].distance < best) best = hits[0].distance;
  // 地形步进
  for (let d = 12; d < best; d += 3) {
    _v1.copy(origin).addScaledVector(dir, d);
    if (_v1.y < mapTerrainHeight(_v1.x, _v1.z)) { best = d; break; }
  }
  if (best < 1600) {
    rig.aimTarget.copy(origin).addScaledVector(dir, best);
    aimDist = best;
  } else {
    rig.aimTarget.copy(rig.farPoint);
  }
}

// ═══════════════════════ 行驶特效（复刻 main.js _driveEffects） ═══════════════════════
function driveEffects(t, dt) {
  if (t.destroyed) return;
  const sp = Math.abs(t.speed);
  t.dustTimer -= dt;
  if (sp > 2 && t.dustTimer <= 0) {
    t.dustTimer = 0.05 - Math.min(sp / 40, 1) * 0.03;
    for (const tl of t.cfg.trackLocal) {
      _v1.fromArray(tl);
      t.model.localToWorld(_v1);
      _v1.y = mapTerrainHeight(_v1.x, _v1.z) + 0.4;
      effects.trackDust(_v1, Math.min(sp / 18, 1));
    }
  }
  t.exhaustTimer -= dt;
  const thr = Math.abs(t.throttle ?? 0);
  const spdN = Math.min(sp / t.cfg.maxSpeed, 1);
  const starting = thr > 0.3 && sp < 5;
  t.startK += ((starting ? 1 : 0) - t.startK) * Math.min(1, dt * (starting ? 6 : 0.8));
  const steerLoad = Math.abs(t.steer ?? 0);
  const dark = Math.min(1, 0.15 + thr * 0.3 * (1 - spdN * 0.6) + t.startK * 0.7 + steerLoad * 0.25);
  const load = Math.min(thr + sp / 30 + steerLoad * 0.35, 1);
  if (t.exhaustTimer <= 0 && (load > 0.15 || sp > 1)) {
    t.exhaustTimer = t.startK > 0.5 ? 0.06 : 0.09;
    const turbine = t.cfg.engineType === 'turbine';
    for (const el of t.cfg.exhaustLocal) {
      _v1.fromArray(el);
      t.model.localToWorld(_v1);
      effects.exhaustPuff(_v1, load, dark, turbine);
    }
  }
}

// ═══════════════════════ HUD ═══════════════════════
const el = (id) => document.getElementById(id);
const retRing = el('retRing'), rangeText = el('rangeText');
const reloadBar = el('reloadBar'), reloadText = el('reloadText');
const ammoPanel = el('ammoPanel'), statusPanel = el('statusPanel');
const scopeOverlay = el('scopeOverlay'), scopeZoom = el('scopeZoom');
const aimText = el('aimText'), gsDisp = el('gsDisp'), gsFlash = el('scopeFlash');
const msgBar = el('msgBar');

// 镜内开火白闪（复刻 ui.js scopeFlash）
function scopeFlash() {
  gsFlash.classList.remove('show');
  void gsFlash.offsetWidth;
  gsFlash.classList.add('show');
}
let msgTimer = null;

function message(text) {
  msgBar.textContent = text;
  msgBar.style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msgBar.style.opacity = 0; }, 1600);
}

function buildAmmoPanel() {
  const p = player;
  const rows = [
    ['ap', '1'], ['heat', '2'], ['he', '3'],
  ].map(([type, key]) => {
    const def = SHELL_TYPES[type];
    const n = p.shellPool[type] ?? 0;
    const sel = p.shellType === type ? 'sel' : (n > 0 ? '' : 'dim');
    return `<div class="${sel}">${key} ${def.name} ×${n}</div>`;
  }).join('');
  const mg = p.cfg.mg ? `<div>F 机枪 ×${p.mgAmmo}</div>` : '';
  ammoPanel.innerHTML = rows + mg;
}

function updateHUD() {
  const p = player;
  if (!p) return;

  // 散布圈（公式复刻 main.js）
  const fovRad = camera.fov * Math.PI / 180;
  const dispPx = Math.tan(p.dispersion) / Math.tan(fovRad / 2) * (innerHeight / 2);
  const ringSize = clamp(30 + dispPx * 2, 30, 300);
  retRing.style.width = retRing.style.height = `${ringSize}px`;

  // 瞄准缩圈进度（公式复刻 main.js：aimFrac ≥ 0.985 判定已瞄准）
  const minD = p.cfg.dispersion;
  const aimFrac = clamp(1 - (p.dispersion - minD) / (minD * 4), 0, 1);
  const aimed = aimFrac >= 0.985 && !p.destroyed;
  retRing.classList.toggle('aimed', aimed);
  aimText.textContent = aimed ? '已瞄准' : `缩圈 ${Math.round(aimFrac * 100)}%`;
  aimText.classList.toggle('aimed', aimed);

  // 测距
  rangeText.textContent = aimDist != null ? `${Math.round(aimDist)} m` : '';

  // 狙击镜
  scopeOverlay.classList.toggle('show', rig.aiming);
  if (rig.aiming) {
    scopeZoom.textContent = `×${(CAMERA.fov / rig.aimFovEff()).toFixed(1)}`;
    // 镜内散布虚线圈：用 aimFovEff 换算散布角直径（公式复刻 main.js）
    const aimFovRad = rig.aimFovEff() * Math.PI / 180;
    const gsD = clamp(Math.tan(p.dispersion) / Math.tan(aimFovRad / 2) * innerHeight, 8, 700);
    gsDisp.style.width = gsDisp.style.height = `${gsD}px`;
  }

  // 装填
  const reloadFrac = 1 - Math.max(p.reload, 0) / p.cfg.reloadTime;
  reloadBar.style.width = `${reloadFrac * 100}%`;
  reloadBar.style.background = reloadFrac >= 1 ? '#8fb073' : '#c8a24a';
  reloadText.textContent = reloadFrac >= 1 ? '就绪' : `装填 ${Math.ceil(p.reload * 10) / 10}s`;

  // 弹药（数字变化时刷新）
  if (updateHUD._ammoKey !== `${p.shellType}:${p.shellPool.ap},${p.shellPool.heat},${p.shellPool.he}:${p.mgAmmo}`) {
    updateHUD._ammoKey = `${p.shellType}:${p.shellPool.ap},${p.shellPool.heat},${p.shellPool.he}:${p.mgAmmo}`;
    buildAmmoPanel();
  }

  // 状态
  statusPanel.innerHTML =
    `${p.cfg.name}<br>` +
    `速度 <span>${Math.round(Math.abs(p.speed) * 3.6)}</span> km/h · 挡位 <span>${p.speed < -0.3 ? 'R' : (Math.abs(p.speed) < 0.3 ? 'N' : 'D')}</span><br>` +
    `烟雾弹 <span>${p.smokeAmmo}/3</span> · 维修 <span>${p.consumables.repair}</span> · 灭火 <span>${p.consumables.ext}</span><br>` +
    `坐标 <span>${Math.round(p.pos.x)}, ${Math.round(p.pos.z)}</span>`;
}

// ═══════════════════════ 小地图 ═══════════════════════
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
let mmStatic = null;
const w2m = (w) => (w + 1000) * 0.09;

function buildMinimapStatic() {
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#1d2a1e';
  g.fillRect(0, 0, 180, 180);
  g.strokeStyle = 'rgba(140,150,120,0.35)';
  g.setLineDash([3, 3]);
  g.strokeRect(w2m(-300), w2m(-300), 600 * 0.09, 600 * 0.09);
  g.setLineDash([]);
  g.strokeStyle = '#555c60';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(w2m(-1000), w2m(0)); g.lineTo(w2m(1000), w2m(0)); g.stroke();
  g.beginPath(); g.moveTo(w2m(0), w2m(-1000)); g.lineTo(w2m(0), w2m(1000)); g.stroke();
  g.fillStyle = '#8a7a5a';
  for (const b of mapBoxes) {
    g.fillRect(w2m(b.x - b.w / 2), w2m(b.z - b.d / 2), Math.max(2, b.w * 0.09), Math.max(2, b.d * 0.09));
  }
  g.strokeStyle = '#3a4a3c';
  g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, 179, 179);
  mmStatic = c;
}

function drawMinimap() {
  if (!mmStatic || !player) return;
  mmCtx.drawImage(mmStatic, 0, 0);
  const mx = w2m(player.pos.x), my = w2m(player.pos.z);
  mmCtx.save();
  mmCtx.translate(mx, my);
  mmCtx.rotate(-player.heading + Math.PI);
  mmCtx.fillStyle = '#ffd24a';
  mmCtx.beginPath();
  mmCtx.moveTo(0, -5); mmCtx.lineTo(3.5, 4); mmCtx.lineTo(-3.5, 4);
  mmCtx.closePath();
  mmCtx.fill();
  mmCtx.restore();
  // 观瞄方向线
  mmCtx.strokeStyle = 'rgba(255,210,74,0.5)';
  mmCtx.lineWidth = 1;
  mmCtx.beginPath();
  mmCtx.moveTo(mx, my);
  mmCtx.lineTo(mx + Math.sin(rig.aimYaw) * 16, my - Math.cos(rig.aimYaw) * 16);
  mmCtx.stroke();
}

// ═══════════════════════ 暂停（复刻 main.js _pause/_resume） ═══════════════════════
function pause() {
  paused = true;
  input.releaseLock();
  audio.stopEngine();
  audio.stopMGLoop();
  prevMgFire = false;
  el('pausePanel').classList.add('show');
}
function resume() {
  paused = false;
  audio.resumeBGM();
  el('pausePanel').classList.remove('show');
  input.requestLock();
}

// ═══════════════════════ 按键（复刻 main.js onKeyDown 战斗分支） ═══════════════════════
input.onKeyDown = (code) => {
  if (!started || paused) {
    if (code === 'Escape' && started && paused) resume();
    return;
  }
  if (code === 'KeyC') rig.toggleOrbit();
  if (code === 'KeyG' && player) {
    if (player.smokeAmmo <= 0) { message('烟雾弹已耗尽'); return; }
    if (player.smokeCooldown > 0) return;
    if (smoke.fire(player)) {
      player.smokeAmmo--;
      player.smokeCooldown = 2;
      message(`烟雾弹发射 (${player.smokeAmmo} 次剩余)`);
      audio.playSmokeLaunch();
    }
  }
  if (code === 'Digit1') switchShell('ap');
  if (code === 'Digit2') switchShell('heat');
  if (code === 'Digit3') switchShell('he');
  if (code === 'KeyR' && player) {
    if (player.consumables.repair > 0) { if (player.useRepairKit()) message('维修包：模块已修复'); else message('无受损模块'); }
    else message('维修包已用完');
  }
  if (code === 'KeyT' && player) {
    if (player.consumables.ext > 0) { if (player.useExtinguisher()) message('灭火器：火焰已扑灭'); else message('未起火'); }
    else message('灭火器已用完');
  }
  if (code === 'Escape') pause();
};

function switchShell(type) {
  const p = player;
  if (!p || p.destroyed) return;
  const def = SHELL_TYPES[type];
  if (!def || p.shellType === type) return;
  if (p.shellPool[type] <= 0) { message(`${def.full}已耗尽`); return; }
  if (p.switchShell(type)) message(`切换 ${def.full} ${def.name}`);
}

// ═══════════════════════ 主循环（复刻 main.js _frame 战斗分支） ═══════════════════════
const clock = new THREE.Timer();
let ambientTimer = 0;

function frame() {
  clock.update();
  const dt = Math.min(clock.getDelta(), 0.05);
  skyMat.uniforms.uTime.value += dt;            // fbm 云层缓慢漂移（shader 内乘 0.003-0.008 系数）

  if (player && !paused) {
    playerControl(dt);
    player.update(dt, effects, audio);
    if (trackMarks) { trackMarks.trackTank(player, dt); trackMarks.update(dt); }
    crushCheck();   // 履带压毁围栏/小件/树木
    rig.update(dt);
    if (effects.shakeAmount > 0.01) rig.shake = Math.max(rig.shake, effects.shakeAmount * 0.8);
    updateRanging();
    driveEffects(player, dt);
    updateHUD();
    drawMinimap();
    world.trackShadow(player.root.position);
  } else {
    world.trackShadow(camera.position);
  }

  // 远景战场氛围烟柱（复刻 main.js）
  ambientTimer -= dt;
  if (ambientTimer <= 0) {
    ambientTimer = 2.5 + Math.random() * 4;
    const a = Math.random() * Math.PI * 2, r = 260 + Math.random() * 260;
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    const y = mapTerrainHeight(x, z);
    for (let i = 0; i < 6; i++) {
      ps.spawn('smoke', {
        x: x + (Math.random() - 0.5) * 8, y: y + Math.random() * 10, z: z + (Math.random() - 0.5) * 8,
        vx: 1 + Math.random(), vy: 3 + Math.random() * 3, vz: (Math.random() - 0.5),
        life: 3 + Math.random() * 3, size0: 6, size1: 18, alpha: 0.16, drag: 0.3,
      });
    }
  }

  if (!paused) {
    smoke.update(dt);
    shells.update(dt);
    effects.update(dt);
    ps.update(dt);
    updateCollapsing(dt);   // 建筑倒塌动画（下沉→废墟）
    updateFallingTrees(dt); // 树木倒伏动画
    updateFallingPylons(dt); // 电线杆倒伏动画
    updatePropFires(dt);    // 建筑火点（火焰+灰烟）
  }
  // 粒子点大小随相机 FoV（狙击变倍时粒子保持世界尺寸，与 main.js 一致）
  ps.setFov(camera.fov, innerHeight);
  renderer.render(scene, camera);
}

// ═══════════════════════ 资源加载与启动 ═══════════════════════
const manager = new THREE.LoadingManager();
const barEl = el('bar'), loadTextEl = el('loadText');
manager.onProgress = (u, l, t) => {
  barEl.style.width = `${(l / t) * 100}%`;
  loadTextEl.textContent = `正在载入模型资源… ${l}/${t}`;
};
manager.onError = (u) => { loadTextEl.textContent = `加载失败: ${u}`; };

const loader = new GLTFLoader(manager);
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('./vendor/three/jsm/libs/draco/');
loader.setDRACOLoader(dracoLoader);
loader.register((parser) => new GLTFPBRSpecGlossExt(parser));
const load = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

// 坦克选择：?tank=t-90m3|leopard_2a7|...（默认 t-90m3）
const params = new URLSearchParams(location.search);
const tankKey = TANKS[params.get('tank')] ? params.get('tank') : 't-90m3';
let tankAsset = null;

(async () => {
  try {
    const [buildingsG, leafG, pineG, rockG, rock2G, logG, tankG] = await Promise.all([
      load('houseModel/town_kit.glb'),
      load('houseModel/objects/leaf_tree.glb'),
      load('houseModel/objects/pine_tree.glb'),
      load('houseModel/objects/rock.glb'),
      load('houseModel/objects/rock2.glb'),
      load('houseModel/objects/wood_log.glb'),
      load(`model/${TANKS[tankKey].model.replace('model/', '')}`),
    ]);
    tankAsset = tankG;

    // —— 建筑模板提取 ——
    {
      const rootScene = new THREE.Group();
      rootScene.add(buildingsG.scene);
      rootScene.updateMatrixWorld(true);
      let rootNode = null;
      buildingsG.scene.traverse(o => { if (!rootNode && o.name === 'RootNode') rootNode = o; });
      if (!rootNode) {
        buildingsG.scene.traverse(o => { if (!rootNode || o.children.length > rootNode.children.length) rootNode = o; });
      }
      for (const child of [...rootNode.children]) {
        const t = child.clone(true);
        child.matrixWorld.decompose(t.position, t.quaternion, t.scale);
        t.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        templates.set(child.name, t);
      }
    }

    // —— 植被模板 ——
    function prepFlora(gltf, key) {
      const root = gltf.scene;
      root.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            m.side = THREE.DoubleSide;
            if (m.map) {
              m.alphaTest = 0.45;
              o.customDepthMaterial = new THREE.MeshDepthMaterial({
                depthPacking: THREE.RGBADepthPacking, map: m.map, alphaTest: 0.45,
              });
            }
          }
        }
      });
      flora[key] = root;
    }
    prepFlora(leafG, 'leaf');
    prepFlora(pineG, 'pine');
    prepFlora(rockG, 'rock');
    prepFlora(rock2G, 'rock2');
    prepFlora(logG, 'log');
    templates.set('wood_log', logG.scene);

    // —— 世界搭建 ——
    buildTown();
    buildPylons();
    scatterNature();
    buildInstancedProps();   // 围栏/植被/岩石/柴堆 → InstancedMesh（可逐个炮毁/压毁）
    buildMinimapStatic();
    spawnPlayer();

    // 验证钩子（自动化测试读取场景统计）
    window.__mapStats = () => ({
      calls: renderer.info.render.calls,
      tris: renderer.info.render.triangles,
      obstacles: world.obstacles.length,
      buildings: mapBoxes.length,
      townMeshes: (() => { let n = 0; townGroup.traverse(o => { if (o.isMesh) n++; }); return n; })(),
      buildingSizes: mapBoxes.slice(0, 12).map(b => `${Math.round(b.w)}x${Math.round(b.d)}`),
      houseRadii: world.obstacles.filter(o => o.r > 3.5).map(o => Math.round(o.r * 10) / 10).slice(0, 20),
      destructibles: destructibles.length,
      destroyed: destructibles.filter(d => !d.alive).length,
      rubbleFields: rubbleFields.length,
      instCounts: Object.fromEntries(Object.keys(instData).map(k => [k, instData[k].length])),
      // 测试辅助：直接伤害物件（自动化验证用；onlyGroup=true 只选建筑）
      __damageNearest: (px, pz, onlyGroup) => {
        let best = null, bd = 1e9;
        for (const d of destructibles) {
          if (!d.alive) continue;
          if (onlyGroup && d.kind !== 'group') continue;
          const cx = d.kind === 'group' ? d.cx : d.x, cz = d.kind === 'group' ? d.cz : d.z;
          const dd = (cx - px) ** 2 + (cz - pz) ** 2;
          if (dd < bd) { bd = dd; best = d; }
        }
        if (!best) return null;
        const cx = best.kind === 'group' ? best.cx : best.x, cz = best.kind === 'group' ? best.cz : best.z;
        const n = best.hp;   // 先取次数（hp 会在命中中递减）
        for (let i = 0; i < n; i++) {
          damageDestructible(best, new THREE.Vector3(cx, mapTerrainHeight(cx, cz) + 1.5, cz));
        }
        return { hpLeft: best.hp, alive: best.alive, rubbleH: best.rule.rubbleH, collapsing: collapsing.length };
      },
      // 测试辅助：瞬移到最近一棵树旁碾倒（自动化验证树倒伏）
      __crushNearestTree: () => {
        if (!player) return 'no player';
        let best = null, bd = 1e9;
        for (const d of destructibles) {
          if (!d.alive || d.kind !== 'inst' || (d.type !== 'leaf' && d.type !== 'pine')) continue;
          const dd = (d.x - player.root.position.x) ** 2 + (d.z - player.root.position.z) ** 2;
          if (dd < bd) { bd = dd; best = d; }
        }
        if (!best) return null;
        player.root.position.set(best.x - 2, mapTerrainHeight(best.x - 2, best.z), best.z);
        const before = destructibles.filter(d => !d.alive).length;
        crushCheck();
        return { crushed: destructibles.filter(d => !d.alive).length - before, type: best.type, alive: best.alive };
      },
      // 测试辅助：炮弹线段穿过 (x,z) 附近最近物件（验证围栏/电线杆穿弹）
      __shellThroughNearest: (px, pz) => {
        let best = null, bd = 1e9;
        for (const d of destructibles) {
          if (!d.alive) continue;
          const cx = d.kind === 'group' ? d.cx : d.x, cz = d.kind === 'group' ? d.cz : d.z;
          const dd = (cx - px) ** 2 + (cz - pz) ** 2;
          if (dd < bd) { bd = dd; best = d; }
        }
        if (!best) return null;
        const cx = best.kind === 'group' ? best.cx : best.x, cz = best.kind === 'group' ? best.cz : best.z;
        const y = mapTerrainHeight(cx, cz) + 2;
        const hit = world.onShellHitDestructible(
          { x: cx - 25, y: y + 2, z: cz - 25 },
          { x: cx + 25, y: y - 1, z: cz + 25 },
          { shellType: 'he' }
        );
        return { type: best.type, alive: best.alive, hit };
      },
      // 测试辅助：坦克瞬移到 (x,z) 并执行履带压毁判定（自动化验证用）
      __crushAt: (x, z) => {
        if (!player) return 'no player';
        player.root.position.set(x, mapTerrainHeight(x, z), z);
        const before = destructibles.filter(d => !d.alive).length;
        crushCheck();
        const after = destructibles.filter(d => !d.alive).length;
        return { crushed: after - before, totalDestroyed: after };
      },
    });

    el('loading').classList.add('hide');
    el('enterMask').classList.remove('hide');
  } catch (e) {
    console.error(e);
    loadTextEl.textContent = `加载失败: ${e.message || e}`;
  }
})();

// 进入战场（用户手势 → 音频解锁 + 指针锁定）
el('enterMask').addEventListener('click', async () => {
  el('enterMask').classList.add('hide');
  el('hud').classList.add('show');
  el('minimapWrap').style.display = '';
  audio.init();
  audio.applySettings({ master: 0.8, sfx: 0.9, ambient: 0.6, bgmOn: false });
  await audio.loadExtSounds(player.cfg);
  audio.startEngine();
  started = true;
  paused = false;
  input.enabled = true;
  input.requestLock();
  clock.getDelta();   // 清帧间隔
  message('地图测试 · W 驶向小镇');
});

el('btnResume').addEventListener('click', resume);
el('btnRespawn').addEventListener('click', () => {
  spawnPlayer();
  resume();
  message('坦克已复位');
});

renderer.setAnimationLoop(frame);
</script>
</body>
</html>
